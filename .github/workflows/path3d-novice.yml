name: path3d-novice
on:
  pull_request:
    paths:
      - 'src/labs/path3d.mjs'
      - 'src/app.mjs'
      - 'src/style.css'
      - 'tests/path3d-novice.mjs'
      - '.github/workflows/path3d-novice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  path3d-novice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:dev
      - run: node tests/path3d-novice.mjs
      - name: Снимки 360, 390, 412 в обеих темах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path3d-novice
          path: tests/out/path3d-novice/
