name: operator-guide
on:
  push:
    branches: ['gpt/operator-cheatsheet']
  pull_request:
    paths:
      - 'data/chapters-*.mjs'
      - 'data/kids.mjs'
      - 'src/app.mjs'
      - 'tests/operator-guide.mjs'
      - '.github/workflows/operator-guide.yml'
jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:dev
      - run: node tests/operator-guide.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-guide-previews
          path: tests/out/operator-*.png
