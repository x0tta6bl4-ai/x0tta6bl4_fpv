# Автотесты на каждый push в любую ветку (claude/ gpt/ gemini/ и main) и вручную (Actions → tests → Run workflow).
# Статус привязан к коммиту, поэтому он же — обязательная проверка PR.
name: tests
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test 2>&1 | tee tests-output.txt
      # Итог тестов — в аннотации запуска: видно на странице PR без открытия журнала.
      - name: Итог тестов
        if: always()
        run: |
          node -e '
            const o = require("fs").existsSync("tests-output.txt") ? require("fs").readFileSync("tests-output.txt", "utf8") : "";
            const lines = o.split("\n").filter((l) => /^(PASS|FAIL) |^      |Всё прошло|Не прошло/.test(l)).slice(0, 60);
            const esc = (s) => s.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
            console.log((/Всё прошло/.test(o) ? "::notice title=npm test::" : "::error title=npm test::") + esc(lines.join("\n") || "нет вывода"));
          '
      - name: Скриншоты телефона (если тест упал)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screens
          path: tests/out/
