# Автотесты на каждый Pull Request и на каждое изменение main.
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Скриншоты телефона (если тест упал)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screens
          path: tests/out/
